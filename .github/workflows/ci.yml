# The ADR-0007 CI gate (spec v1 §11 ticket 11): pull requests and pushes to
# `main` block on compile + package + headless server gametests on all six
# Anchors, plus client gametests on the 26.2 canary (retry once). The matrix is
# generated from the Stonecutter workspace by .github/scripts/generate-matrix.py
# - adding an Anchor subproject extends CI with no workflow edits (ADR-0006
# rolling version pickup). Supersedes the ticket-#22 bootstrap `build.yml`.
name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# Standing default (ADR-0007): one run per ref - a new push cancels the
# superseded run instead of racing it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  matrix:
    name: Generate Anchor matrix
    runs-on: ubuntu-latest
    outputs:
      json: ${{ steps.generate.outputs.json }}
    steps:
      - name: Checkout
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v6

      - name: Generate the Anchor matrix from the Stonecutter workspace
        id: generate
        run: echo "json=$(python3 .github/scripts/generate-matrix.py)" >> "$GITHUB_OUTPUT"

  # Gate table (ADR-0007): compile + package + headless server gametests on
  # every Anchor. `:version:build` covers compile, package, and the unit suites
  # (`check`); `:version:runGameTest` is the headless dedicated-server gametest
  # run (#30). Both in one invocation, so the gametests run exactly once even
  # though fabricApi.configureTests wires `runGameTest` into `check` (#30).
  # JDK 25 runners (ADR-0007); the Anchors' own Java 21/25 toolchains resolve
  # through the foojay resolver (ADR-0006).
  anchor:
    name: "anchor (${{ matrix.version }}): build + server gametests"
    needs: matrix
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.matrix.outputs.json).anchor }}
    steps:
      - name: Checkout
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v6

      - name: Set up JDK 25
        uses: actions/setup-java@0781fc6af30d3e1f67f2d243034e1a15cf5f3677 # v5
        with:
          distribution: temurin
          java-version: 25

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          validate-wrappers: true

      - name: Build and run the server gametests
        env:
          ANCHOR: ${{ matrix.version }}
        run: ./gradlew ":$ANCHOR:build" ":$ANCHOR:runGameTest" --stacktrace

  # Gate table (ADR-0007): client gametests on a single canary - the default
  # development Anchor - which retries once before failing (the known
  # network-synchronizer flake; the run itself already disables that
  # synchronizer, PR #50). Two deliberate choices here:
  # - Serial run (`--max-workers=1`): parallel workers trip the 1.21.4-line
  #   module's hard-coded 10 s in-process server timeout and hang (PR #50).
  # - `xvfb-run` wrapper: client GL works headless on a developer box, but CI
  #   runners differ (no GPU, image-dependent Mesa), so the run gets a
  #   deterministic software-GL X display. Xvfb is preinstalled on
  #   GitHub-hosted Ubuntu runners; the install step only fires if not.
  client-canary:
    name: client gametests (canary ${{ matrix.version }})
    needs: matrix
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.matrix.outputs.json).canary }}
    steps:
      - name: Checkout
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v6

      - name: Set up JDK 25
        uses: actions/setup-java@0781fc6af30d3e1f67f2d243034e1a15cf5f3677 # v5
        with:
          distribution: temurin
          java-version: 25

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          validate-wrappers: true

      - name: Ensure Xvfb is available
        run: command -v xvfb-run >/dev/null 2>&1 || { sudo apt-get update && sudo apt-get install -y xvfb; }

      - name: Run the client gametests (serial, retry once)
        env:
          ANCHOR: ${{ matrix.version }}
        run: |
          xvfb-run -a ./gradlew ":$ANCHOR:runClientGameTest" --max-workers=1 --stacktrace \
            || xvfb-run -a ./gradlew ":$ANCHOR:runClientGameTest" --max-workers=1 --stacktrace

  # The single required status check for branch protection (ADR-0007): one
  # stable name over the generated matrix, so a rolled or added Anchor never
  # orphans a required check that no job reports any more. `if: always()` keeps
  # the gate reporting even when an upstream job fails, is cancelled, or is
  # skipped (for example a matrix-generation failure) - in every such case the
  # gate fails rather than leaving the check pending.
  gate:
    name: CI gate
    needs: [anchor, client-canary]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Evaluate the ADR-0007 gate
        run: |
          if [[ "${{ contains(needs.*.result, 'failure') }}" == 'true' ]] \
            || [[ "${{ contains(needs.*.result, 'cancelled') }}" == 'true' ]] \
            || [[ "${{ contains(needs.*.result, 'skipped') }}" == 'true' ]]; then
            echo "One or more gated jobs did not pass: ${{ toJSON(needs.*.result) }}"
            exit 1
          fi
          echo "All ADR-0007 gate jobs passed."
