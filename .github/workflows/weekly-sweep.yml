# The ADR-0007 weekly drift sweep: client gametests extend from the 26.2 canary
# of the PR gate to every 1.21.4+ Anchor (1.21.1 ships no client gametest
# module at any Fabric API version - testing research #17). The matrix is
# generated from the Stonecutter workspace by .github/scripts/generate-matrix.py.
# Also dispatchable on demand from the Actions tab.
name: weekly-sweep

on:
  schedule:
    # Mondays 04:23 UTC - off the top-of-hour busy minute.
    - cron: "23 4 * * 1"
  workflow_dispatch:

# Standing default (ADR-0007): one run per ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  matrix:
    name: Generate Anchor matrix
    runs-on: ubuntu-latest
    outputs:
      json: ${{ steps.generate.outputs.json }}
    steps:
      - name: Checkout
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v6

      - name: Generate the Anchor matrix from the Stonecutter workspace
        id: generate
        run: echo "json=$(python3 .github/scripts/generate-matrix.py)" >> "$GITHUB_OUTPUT"

  # One client-gametest job per 1.21.4+ Anchor. Serial run and the xvfb wrapper
  # mirror the ci.yml canary job: parallel workers trip the 1.21.4-line module's
  # hard-coded 10 s in-process server timeout (PR #50), and `xvfb-run` gives CI
  # runners (no GPU, image-dependent Mesa) a deterministic software-GL display.
  # Retry once: these runs ride an experimental API with a known
  # network-synchronizer flake (ADR-0007), and a flake is not drift.
  client-sweep:
    name: client sweep (${{ matrix.version }})
    needs: matrix
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.matrix.outputs.json).client }}
    steps:
      - name: Checkout
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v6

      - name: Set up JDK 25
        uses: actions/setup-java@0781fc6af30d3e1f67f2d243034e1a15cf5f3677 # v5
        with:
          distribution: temurin
          java-version: 25

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          validate-wrappers: true

      - name: Ensure Xvfb is available
        run: command -v xvfb-run >/dev/null 2>&1 || { sudo apt-get update && sudo apt-get install -y xvfb; }

      - name: Run the client gametests (serial, retry once)
        env:
          ANCHOR: ${{ matrix.version }}
        run: |
          xvfb-run -a ./gradlew ":$ANCHOR:runClientGameTest" --max-workers=1 --stacktrace \
            || xvfb-run -a ./gradlew ":$ANCHOR:runClientGameTest" --max-workers=1 --stacktrace
