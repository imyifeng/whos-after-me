# CI bootstrap for the Stonecutter workspace (spec v1 §11 ticket 1).
# The full per-version matrix, gametest jobs, and release gates land with ticket 11
# (ADR-0007); this job proves `chiseledBuild` builds all six Anchors on every PR.
name: build

on:
  pull_request:
  push:
    branches: [main]

jobs:
  chiseled-build:
    name: Build all anchors
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v6

      - name: Set up JDK 25
        uses: actions/setup-java@0781fc6af30d3e1f67f2d243034e1a15cf5f3677 # v5
        with:
          distribution: temurin
          java-version: 25

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Build all anchors
        run: ./gradlew chiseledBuild --stacktrace
